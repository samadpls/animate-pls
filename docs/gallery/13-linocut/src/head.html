<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become the storm</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, 100vw); width: auto; aspect-ratio: 1 / 1; display: block; cursor: pointer; }
</style>

<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  GALLERY TILE 18 — linocut, 1:1, 3.0s @ 120 BPM, 24fps, on 2s. "Become the storm": the interlude on samadpls.com
//  carries Allama Iqbal's line from Jawab-e-Shikwa (public domain; Iqbal died in 1938), glossed there as "you are the
//  song of the wave / become the storm". A carved wave rises out of the sea into a storm; a swallow rides it up, and
//  the red block rolls STORM into the sky. The Urdu line prints only where a Nastaliq face is installed; else English.
//  Frame 0 already holds the sea, the sky and the first line; the last 0.4s is a calm hold (rain, the storm turning).
//  Build: node <skill>/tools/build.mjs docs/gallery/18-linocut
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';   // the storyboard's font
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneTile()]];
const SHOTS = [
  ['tile', 0, 0.0, 3.0, 'a carved wave rises into a storm; a swallow rides it; STORM rolls in in red'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'single-era',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { rise: 0.0, crest: 1.25, become: 0.75, roll: 1.5, rolled: 2.1, flash: 2.0, iqbal: 2.25 },
  acts: [
    { name: '1 The wave', role: 'build', t0: 0.0, t1: 1.5 },
    { name: '2 The storm', role: 'gift', t0: 1.5, t1: 3.0 },
  ],
  board: [
    { t: 1.0, title: 'the wave rises, the swallow rides it', sound: 'a low swell, wind', next: 'STORM rolls in' },
    { t: 2.5, title: 'become the storm', sound: 'a drum hit and a low chord', next: 'calm hold' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
