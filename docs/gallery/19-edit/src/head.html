<title>animate-pls · edit mode</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, 100vw); width: auto; aspect-ratio: 1 / 1; display: block; cursor: pointer; }

<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  GALLERY TILE 15 — edit mode. 1:1, 3.5s @ 24fps, cutout. Also a clip for the launch montage: the first frame
//  already shows the scene, the zoom and the click happen inside it, the finished video is on screen by 2.4s and
//  the last second holds still.
//  The footage is animate-pls itself at work (the edit template's studio page), recorded, never committed:
//    node <skill>/tools/record.mjs docs/gallery/15-edit app <skill>/templates/edit/sample/steps.json
//  (or: node <skill>/tools/footage.mjs docs/gallery/15-edit --ensure). Words: the site's own line about the skill.
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.5;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';
const CX = 540;

// the recording from just before "approve" to the finished video, a touch faster than life (1.5x)
const CLIP = { name: 'app', t0: 0, t1: DURATION, src0: 5.85, speed: 1.5 };
const ERA_LIST = [[0, DURATION, () => sceneTile()]];
const SHOTS = [['edit', 0, 0, DURATION, 'the brief approved, rendered, playing']];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'edit',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  clips: [CLIP],
  // source seconds of the recording: in on the beats as "approve" is clicked, then a pan to the finished video, held
  zooms: [
    { clip: 'app', events: ['mark:#story', 'mark:#log'], t0: 6.5, t1: 7.2, pad: 0.06, in: 0.5, land: 0.12 },
    { clip: 'app', event: 'mark:#stage', scale: 1.62, land: 0.15, hold: 4 },
  ],
  cues: { tag1: 0.0, tag2: 1.95, done: 2.05 },
  acts: [
    { name: '1 Approve', role: 'build', t0: 0, t1: 1.6 },
    { name: '2 The video', role: 'gift', t0: 1.6, t1: DURATION },
  ],
  board: [{ t: 3.1, title: 'one brief in, repeatable video out', sound: 'a click, a soft chime', next: 'end' }],
  narration: [],
};
window.TIMELINE = TIMELINE;
