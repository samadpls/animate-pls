<canvas id="c" width="1080" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  05-MATH — gallery tile, 1:1, 3.0s @ 120 BPM, 24fps, motion on 1s. BestRAG, a library for hybrid RAG:
//  a hybrid score s(q, d) is Written as a weighted sum of dense, sparse and late-interaction scores, and each
//  document's bar is built from those three coloured parts, so the ranked list d1, d2, d3 IS the sum.
//  (The weighted sum illustrates hybrid fusion; it is not claimed to be BestRAG's exact formula.)
//  Colour code (one colour per quantity, everywhere): dense red, sparse green, late interaction pink,
//  the hybrid score s yellow; q and d are neutral white. Thumbnail: t = 2.5.
//  Build: node <skill>/tools/build.mjs docs/gallery/05-math
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = 'Cambria, "Cambria Math", "Latin Modern Roman", "CMU Serif", "STIX Two Text", "Times New Roman", Georgia, serif';   // the storyboard's title font
const CX = 540;   // caption centre x: the middle of the square frame

const ERA_LIST = [[0, 3, () => sceneTile()]];
const SHOTS = [
  ['tile', 0, 0.0, 3.0, 'BestRAG: s(q, d) = dense + sparse + late interaction, ranked d1 > d2 > d3'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { tag: 0.0, eq: 0.15, axes: 0.5, bars: 0.85, totals: 1.45, box: 1.6, flash: 1.75 },
  acts: [
    { name: '1 Hybrid score', role: 'build', t0: 0.0, t1: 3.0 },
  ],
  board: [
    { t: 2.5, title: 'BestRAG: three scores, one ranking', sound: 'a soft pad, plucks on the bars, a chime on the flash', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
