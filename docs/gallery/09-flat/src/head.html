// =====================================================================
//  GALLERY TILE 12 — flat, 1:1, 3.0s @ 120 BPM, 24fps. ArchData (samadpls.com, Selected Work): "a pipeline for
//  generating and augmenting routing data" for LLM routing. A switchyard in space: a generator rolls out
//  conversations as speech-bubble wagons; the hero throws the switch and each wagon rolls onto the track of its
//  policy (travel, banking, kitchen: domains of the source intent data). Everything is on screen from frame 0,
//  the routed wagon arrives by 2.35s, and the last 0.5s is a calm hold (stars, puffs, the gear, the hero's bob).
//  The thumbnail is the frame at t = 1.8 (piece.json "thumb"): the wagon climbing onto its route.
//  Build: node <skill>/tools/build.mjs docs/gallery/12-flat
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';   // the storyboard's title font
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneYard()]];
const SHOTS = [
  ['yard', 0, 0.0, 3.0, 'the hero throws the switch; a generated conversation rolls onto the track of its policy'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'single-era',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { wait: 0.6, throw: 0.5, go: 0.9, arrive: 2.35, next: 1.35, settle: 2.5 },
  acts: [
    { name: '1 Route', role: 'build', t0: 0.0, t1: 3.0 },
  ],
  board: [
    { t: 2.5, title: 'routing data, generated', sound: 'a soft pad, a switch click, a chime on arrival', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
