<script>
"use strict";
// =====================================================================
//  06-PIXEL — a README gallery tile. 1:1, 3.0s @ 120 BPM, 24fps, one era at 180x180 (6 px per pixel), PAL16.
//  GraphNeT: a cross-section of the Antarctic ice under the snow. Seven strings of sensors; a particle track
//  crosses them, the sensors near it light up warm by time, and thin graph edges join the lit sensors (the GNN's
//  graph). The hero watches from the snow. Everything settles by 2.2s; the thumbnail is the frame at t = 2.5.
//  Build: node <skill>/tools/build.mjs docs/gallery/06-pixel
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';   // only the storyboard sheet uses a system font
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneTile()]];
const SHOTS = [
  ['tile', 0, 0.0, 3.0, 'a track crosses the strings in the ice; the lit sensors join into a graph; the hero watches'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { tag: 0.2, track: 0.5, trackEnd: 1.3, spot: 1.0, graph: 1.3, caption: 1.5, settle: 2.2 },
  acts: [
    { name: '1 Event', role: 'build', t0: 0.0, t1: 3.0 },
  ],
  board: [
    { t: 2.5, title: 'the GNN joins the lit sensors', sound: 'soft pad, a blip per hit, a chime', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
