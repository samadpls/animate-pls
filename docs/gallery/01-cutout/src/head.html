<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, 100vw); width: auto; aspect-ratio: 1 / 1; display: block; cursor: pointer; }

<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  GALLERY TILE 01 — cut paper, 1:1, 3.0s @ 120 BPM, 24fps. One era: a paper neural circuit on a night wall;
//  a spike runs down an axon with the spark riding it, and the EEG-like trace writes itself onto a paper strip.
//  The thumbnail is the frame at t = 2.5 (everything has settled by 2.2s).
//  Build: node <skill>/tools/build.mjs <this piece dir>
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;   // 0.5 / 0.25 / 0.125s = 12 / 6 / 3 frames
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };              // a square README tile: a plain 60px margin all round
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';   // local handwriting fonts: Windows, macOS, Linux
const CX = 540;                                               // caption centre

// eras: [t0, t1, scene]. One era, no bridges.
const ERA_LIST = [[0, 3, () => sceneTile()]];
const SHOTS = [
  //  key        era  t0    t1    title
  ['circuit',    0,   0.0,  3.0,  'a spike runs down the axon, the spark riding it; the trace writes on'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],              // hard cuts (seconds, on the 8th grid)
  morphs: [],            // morph bridge centres (seconds, on the 8th grid)
  cues: { tag: 0.25, spike: 0.5, trace: 0.5 },
  acts: [
    { name: '1 Circuit', role: 'build', t0: 0.0, t1: 3.0 },
  ],
  // the storyboard: one key frame (the README thumbnail)
  board: [
    { t: 2.5, title: 'the spark rides a spike', sound: 'a soft pad', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
