// =====================================================================
//  GALLERY TILE 20 — TERMINAL. 1:1, 3.0s @ 120 BPM, 24fps, one shot. From the owner's post "Production evals are

//  Build: node <skill>/tools/build.mjs docs/gallery/20-terminal
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, left: 60, right: 60 };
const HAND = '"SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';   // the storyboard's title font (kit/board.js)
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneEvals()]];
const SHOTS = [
  ['evals', 0, 0.0, 3.0, 'run evals: the code tier gates and ticks, the judge and multimodal tiers go to review, CI passed'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '1:1',
