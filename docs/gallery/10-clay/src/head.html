<script>
"use strict";
// =====================================================================
//  GALLERY TILE 13 — clay, 1:1, 3.0s @ 120 BPM, 24fps, on 2s. "Four years of showing up" (samadpls.com blog):
//  he got his own laptop a few days before university and arrived not really knowing how to use a computer.
//  A clay lump types its first "hello, world" with a ctrl+c note stuck to the lid; the fourth year-block drops onto
//  the stack and it turns to look. The first frame already has the set; the last 0.4s is a calm hold.
//  Build: node <skill>/tools/build.mjs docs/gallery/13-clay
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';   // local handwriting fonts: Windows, macOS, Linux
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneTile()]];
const SHOTS = [
  ['tile', 0, 0.0, 3.0, 'a clay lump types hello, world on its first laptop; the fourth year-block lands on the stack'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'single-era',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { title: 0.0, title2: 0.35, type1: 0.15, type2: 0.75, drop: 1.25, land: 1.5, cheer: 1.58, down: 2.17, blink: 2.75 },
  acts: [
    { name: '1 Showing up', role: 'build', t0: 0.0, t1: 1.5 },
    { name: '2 Year four', role: 'gift', t0: 1.5, t1: 3.0 },
  ],
  board: [
    { t: 1.0, title: 'typing hello, world', sound: 'soft key ticks over a pad', next: 'the fourth block drops' },
    { t: 2.5, title: 'year four lands', sound: 'a clay plop, a small chime', next: 'calm hold' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
