{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }

const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60 };
const HAND = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';   // the storyboard's title font (kit/board.js)
const CX = 540;
const KIN_GROUND = 'ink';   // the kit's ground for this piece (read by styles/kinetic/kit.js)

const ERA_LIST = [[0, 3, () => sceneTile()]];
const SHOTS = [
  ['motto', 0, 0.0, 3.0, 'BUILD IT, / TEST IT, / LEAVE IT stack in; AS IS. is struck out and flips to BETTER. on the pop box'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: '1:1',
