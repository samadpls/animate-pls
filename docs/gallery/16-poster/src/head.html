<title>The hundredth question</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, 100vw); width: auto; aspect-ratio: 1 / 1; display: block; cursor: pointer; }

<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  GALLERY TILE 21 — poster, 1:1, 3.0s @ 120 BPM, 24fps, on 2s. "The hundredth question" (samadpls.com, About):
//  "I care about what happens after the demo: whether it still answers well on the hundredth question, on a slow day."
//  A 70s screenprint: a sleepy sun dozes over striped hills, rainbow bands slide in around it, a huge 100 stamps in
//  digit by digit, the headline stamps along an arch, and on a slow day lands on a ribbon while the sun half-opens
//  an eye and yawns. The first frame already has the sheet, the rays and the sun; the last 0.4s is a calm hold.
//  Build: node <skill>/tools/build.mjs docs/gallery/21-poster
// =====================================================================
const FPS = 24, W = 1080, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 3.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 60, right: 60, left: 60 };
const HAND = '"Cooper Black", Superclarendon, "Bookman Old Style", Georgia, serif';   // the storyboard's title font (kit/board.js)
const CX = 540;

const ERA_LIST = [[0, 3, () => sceneTile()]];
const SHOTS = [
  ['tile', 0, 0.0, 3.0, 'a sleepy sun under a huge 100: the hundredth question, on a slow day'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'single-era',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [],
  cues: { bands: 0.0, digits: [0.5, 0.75, 1.0], head: 1.25, ribbon: 1.75, slow: 2.0, yawn: 1.5, peek: 2.25 },
  acts: [
    { name: '1 The hundredth', role: 'build', t0: 0.0, t1: 1.75 },
    { name: '2 On a slow day', role: 'gift', t0: 1.75, t1: 3.0 },
  ],
  board: [
    { t: 1.2, title: 'the 100 stamps in', sound: 'three soft press thuds', next: 'the headline arches over it' },
    { t: 2.5, title: 'on a slow day', sound: 'a low chime, a yawn', next: 'calm hold' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
