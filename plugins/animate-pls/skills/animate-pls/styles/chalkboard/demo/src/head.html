<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalkboard demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #14110e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  CHALKBOARD DEMO — 6.0s @ 120 BPM, 24fps, in 9:16 (main), 1:1 and 16:9. A physics lesson on the slate: an apple
//  falls from a chalk tree (its positions ghosted at equal times, spreading as it speeds up) while the hero points;
//  the apple becomes the moon, which falls around the Earth the same way. Proves the kit renders, morphs and stays
//  deterministic. Build: node <skill>/tools/build.mjs <skill>/styles/chalkboard/demo   (?format=1:1 or 16:9)
// =====================================================================
const FORMATS = { '9:16': [1080, 1920], '1:1': [1080, 1080], '16:9': [1920, 1080] };
const FORMAT = new URLSearchParams(location.search).get('format') || '9:16';
const FPS = 24, [W, H] = FORMATS[FORMAT];
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = 120, GRID0 = 0, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { '9:16': { top: 240, bottom: 420, right: 140 }, '1:1': { top: 60, bottom: 110, right: 60 }, '16:9': { top: 60, bottom: 110, right: 60 } }[FORMAT];
const HAND = '"Chalkduster", "Ink Free", "Segoe Print", "Chalkboard SE", "Bradley Hand", "Comic Neue", cursive';   // the storyboard's title font
const CX = FORMAT === '9:16' ? 450 : (W - SAFE.right) / 2;   // 9:16: left of the TikTok rail (x 780) below y 840
const M1 = 3.0;   // the morph: the apple becomes the moon

const ERA_LIST = [[0, M1, () => sceneApple()], [M1, DURATION, () => sceneMoon()]];
const SHOTS = [
  ['apple', 0, 0.0, M1, 'an apple falls from a chalk tree, its positions ghosted at equal times; the hero points'],
  ['moon',  1, M1, DURATION, 'the apple becomes the moon, falling around the Earth the same way'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [M1],
  cues: { drop: 0.5, land: 1.25, g: 1.4, push: 1.9, orbit: 3.4, arrows: 4.0 },
  acts: [
    { name: '1 Apple', role: 'build', t0: 0.0, t1: M1 },
    { name: '2 Moon',  role: 'gift',  t0: M1, t1: DURATION },
  ],
  board: [
    { t: 1.75, title: 'an apple falls', sound: 'a soft pad, chalk ticks as each ghost is drawn, a thud', next: 'the apple becomes the moon' },
    { t: 5.0, title: 'so does the moon', sound: 'a warmer pad, a chime on the morph', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
