<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  POSTER DEMO — 6.0s @ 120 BPM, 24fps, on 2s, in 9:16 (main), 1:1 and 16:9. A 70s screenprint: the sun rises
//  over striped hills inside rainbow bands and "good morning" stamps along an arch; the sun becomes the yolk of an egg
//  frying on a gingham cloth, "sunny side up". Proves the kit prints, morphs (a sunburst disc through a band-framed
//  opening) and stays deterministic in every format.
//  Build: node <skill>/tools/build.mjs <skill>/styles/poster/demo  (?format=1:1 or ?format=16:9 for the others)
// =====================================================================
const FORMATS = { '9:16': [1080, 1920], '1:1': [1080, 1080], '16:9': [1920, 1080] };
const FORMAT = new URLSearchParams(location.search).get('format') || '9:16';
const FPS = 24, [W, H] = FORMATS[FORMAT];
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = 120, GRID0 = 0, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
// 9:16: the TikTok / Reels / Shorts union (tools/safezones.mjs); other shapes a 60px margin
const SAFE = { '9:16': { top: 290, bottom: 672, left: 120, right: 192 }, '1:1': { top: 60, bottom: 90, left: 60, right: 60 }, '16:9': { top: 60, bottom: 90, left: 60, right: 60 } }[FORMAT];
const HAND = '"Cooper Black", Superclarendon, "Bookman Old Style", Georgia, serif';   // the storyboard's title font (kit/board.js)
const CX = (W - SAFE.right + SAFE.left) / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);
const M1 = onBeat(3.0);   // the morph: the sun becomes the yolk

const ERA_LIST = [[0, M1, () => sceneSunrise()], [M1, DURATION, () => sceneBreakfast()]];
const SHOTS = [
  ['sunrise', 0, 0.0, M1, 'the sun rises over striped hills; good morning stamps along an arch'],
  ['breakfast', 1, M1, DURATION, 'the sun is the yolk of an egg frying on a gingham cloth: sunny side up'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [M1],
  cues: { rise: 0.25, bands: 0.5, wake: 1.25, head: 1.5, fry: 3.75, head2: 4.0, steam: 3.5 },
  acts: [
    { name: '1 Sunrise', role: 'build', t0: 0.0, t1: M1 },
    { name: '2 Breakfast', role: 'gift', t0: M1, t1: DURATION },
  ],
  board: [
    { t: 2.2, title: 'good morning', sound: 'a rising pluck, a press thud', next: 'the sun becomes the yolk' },
    { t: 5.0, title: 'sunny side up', sound: 'a sizzle, a warm pad', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
