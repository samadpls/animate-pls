<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1d20; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  FLAT DEMO — 6.0s @ 120 BPM, 24fps, in 9:16 (main), 1:1 and 16:9. A star sends light across space to a
//  ringed planet while the hero watches; the planet becomes a leaf cell, whose gears turn the light into sugar
//  cubes that roll out along an arrow path to the hero. Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/flat/demo   (?format=1:1 or ?format=16:9 for the others)
// =====================================================================
const FORMATS = { '9:16': [1080, 1920], '4:5': [1080, 1350], '1:1': [1080, 1080], '16:9': [1920, 1080] };
const FORMAT = new URLSearchParams(location.search).get('format') || '9:16';
const FPS = 24, [W, H] = FORMATS[FORMAT];
{ const cv = document.getElementById('c'); cv.width = W; cv.height = H; }
const BPM = typeof BEATS !== 'undefined' ? BEATS.bpm : 120, GRID0 = typeof BEATS !== 'undefined' ? BEATS.offset : 0;
const BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { '9:16': { top: 240, bottom: 420, right: 140 }, '4:5': { top: 80, bottom: 160, right: 60 }, '1:1': { top: 60, bottom: 110, right: 60 }, '16:9': { top: 60, bottom: 110, right: 60 } }[FORMAT];
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';   // the storyboard's title font
const CX = (W - SAFE.right) / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);
const M1 = onBeat(3.0);   // the morph: the planet becomes a leaf cell

const ERA_LIST = [[0, M1, () => sceneSpace()], [M1, DURATION, () => sceneCell()]];
const SHOTS = [
  ['space', 0, 0.0, M1, 'a star sends light across space to a ringed planet; the hero watches it arrive'],
  ['cell',  1, M1, DURATION, 'the planet becomes a leaf cell; its gears turn light into sugar for the hero'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [M1],
  cues: { beam: onBeat(0.5), arrive: onBeat(1.5), comet: 1.2, push: 1.5, cubes: onBeat(3.75), catch: onBeat(4.75) },
  acts: [
    { name: '1 Space', role: 'build', t0: 0.0, t1: M1 },
    { name: '2 Cell',  role: 'gift',  t0: M1, t1: DURATION },
  ],
  board: [
    { t: 2.0, title: 'light leaves the star', sound: 'a soft pad, rising plucks', next: 'the planet becomes a cell' },
    { t: 5.4, title: 'and becomes sugar', sound: 'a warm chord, blips as the cubes roll', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
